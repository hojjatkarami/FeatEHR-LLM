version: 1
formatters:
  simple:
    format: "[%(levelname)s] - %(asctime)s - %(name)s - %(message)s"

handlers:
  console:
    class: logging.StreamHandler
    level: INFO
    formatter: simple
    stream: ext://sys.stdout

  file:
    class: logging.FileHandler
    level: DEBUG
    formatter: simple
    filename: logs/app.log

root:
  level: INFO
  handlers: [console, file]
